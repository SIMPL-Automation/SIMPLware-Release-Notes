<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SIMPLware Release Notes</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="SIMPLware Release Notes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon" type="image/png" href="_media/images/icons/favicon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Theme: Simple Dark -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

    <!-- Custom theme styles -->
    <link rel="stylesheet" href="css/theme-root.css">
    <link rel="stylesheet" href="css/theme-components.css">
</head>

<body>
    <div id="app">Please wait...</div>

    <script>
        // Shared weak gate helpers (client-side only, not real security)
        (function () {
            var STORAGE_KEY = 'simpl_rn_unlocked';
            var TARGET_HASH = '#/README';

            function isUnlocked() {
                try {
                    return window.sessionStorage && window.sessionStorage.getItem(STORAGE_KEY) === '1';
                } catch (e) {
                    return false;
                }
            }

            function setUnlocked() {
                try {
                    window.sessionStorage && window.sessionStorage.setItem(STORAGE_KEY, '1');
                } catch (e) {
                    // ignore
                }
            }

            function isCoverHash(hash) {
                if (!hash || hash === '#') {
                    return true;
                }

                var cleaned = hash.replace(/^#/, '');
                if (cleaned === '' || cleaned === '/' || cleaned === '/?') {
                    return true;
                }

                var path = cleaned.split('?')[0];
                return path === '' || path === '/';
            }

            function redirectToCoverIfLocked() {
                if (isUnlocked()) {
                    return;
                }

                if (!isCoverHash(window.location.hash)) {
                    var url = window.location.pathname + window.location.search + '#/';
                    window.location.replace(url);
                }
            }

            function redirectToTargetIfUnlocked() {
                if (!isUnlocked()) {
                    return;
                }

                if (!window.location.hash || window.location.hash === '#/' || window.location.hash === '#') {
                    window.location.hash = TARGET_HASH;
                }
            }

            window.SIMPL_GATE = {
                isUnlocked: isUnlocked,
                setUnlocked: setUnlocked,
                redirectToCoverIfLocked: redirectToCoverIfLocked,
                redirectToTargetIfUnlocked: redirectToTargetIfUnlocked,
            };

            window.addEventListener('hashchange', redirectToCoverIfLocked);
            redirectToCoverIfLocked();
        })();
    </script>

    <script>
        // Ticket tag rendering, shared by the Docsify plugin and the PDF export script.
        (function () {
            var TICKET_URL_BASE = 'https://dev.azure.com/SimplAutomation/SIMPLware/_workitems/edit/';
            var TICKET_RE = /\[#(\d+)\]/g;
            var HAS_TICKET_RE = /\[#\d+\]/;

            function createTag(doc, label, ticketNumber) {
                var link = doc.createElement('a');
                link.className = 'ticket-tag';
                link.href = TICKET_URL_BASE + ticketNumber;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.title = 'Open ticket #' + ticketNumber + ' in Azure DevOps';
                link.textContent = label;
                return link;
            }

            function buildFragment(doc, text) {
                var frag = doc.createDocumentFragment();
                var lastIndex = 0;
                var match;

                TICKET_RE.lastIndex = 0;
                while ((match = TICKET_RE.exec(text)) !== null) {
                    if (match.index > lastIndex) {
                        frag.appendChild(
                            doc.createTextNode(text.slice(lastIndex, match.index))
                        );
                    }
                    frag.appendChild(createTag(doc, match[0], match[1]));
                    lastIndex = match.index + match[0].length;
                }

                if (lastIndex < text.length) {
                    frag.appendChild(doc.createTextNode(text.slice(lastIndex)));
                }

                return frag;
            }

            // Docsify wraps heading text in its own anchor, and anchors cannot nest,
            // so heading tags are appended to the heading beside that anchor.
            function appendTagsToHeading(doc, textNode, heading) {
                var tags = [];
                var stripped = textNode.nodeValue.replace(
                    TICKET_RE,
                    function (label, ticketNumber) {
                        tags.push(createTag(doc, label, ticketNumber));
                        return '';
                    }
                );

                textNode.nodeValue = stripped.replace(/\s{2,}/g, ' ').replace(/\s+$/, '');
                tags.forEach(function (tag) {
                    heading.appendChild(tag);
                });
            }

            function linkify(root) {
                if (!root) {
                    return;
                }

                var doc = root.ownerDocument || document;
                var walker = doc.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
                var textNodes = [];

                while (walker.nextNode()) {
                    textNodes.push(walker.currentNode);
                }

                textNodes.forEach(function (textNode) {
                    if (!HAS_TICKET_RE.test(textNode.nodeValue) || !textNode.parentElement) {
                        return;
                    }

                    // Already a rendered pill (e.g. a visual example that should not link).
                    if (textNode.parentElement.closest('.ticket-tag')) {
                        return;
                    }

                    var parentAnchor = textNode.parentElement.closest('a');
                    if (!parentAnchor) {
                        textNode.parentNode.replaceChild(
                            buildFragment(doc, textNode.nodeValue),
                            textNode
                        );
                        return;
                    }

                    var heading = parentAnchor.parentElement;
                    if (heading && /^H[1-6]$/.test(heading.tagName)) {
                        appendTagsToHeading(doc, textNode, heading);
                    }
                });
            }

            window.SIMPL_TICKETS = {
                urlBase: TICKET_URL_BASE,
                createTag: createTag,
                linkify: linkify,
            };
        })();
    </script>

    <script>
        window.$docsify = {
            name: 'SIMPLware Release Notes',
            repo: '',
            coverpage: true,
            onlyCover: true,
            plugins: [
                function (hook, vm) {
                    hook.doneEach(function () {
                        window.SIMPL_TICKETS.linkify(
                            document.querySelector('.markdown-section')
                        );
                    });
                },
                function (hook, vm) {
                    var RELEASE_HEADER_RE = /^#\s+v\d+\.\d+\.\d+\b/m;
                    var BTN_ID = 'upcoming-release-btn';
                    var hasUpcoming = null;
                    var fetchPromise = null;
                    var scrollTopPending = false;

                    function requestScrollTop() {
                        scrollTopPending = true;
                    }

                    function scrollToTop() {
                        window.scrollTo(0, 0);
                        document.documentElement.scrollTop = 0;
                        document.body.scrollTop = 0;
                        ['.content', 'main', '.markdown-section'].forEach(function (sel) {
                            var el = document.querySelector(sel);
                            if (el) {
                                el.scrollTop = 0;
                            }
                        });
                    }

                    function ensureUpcomingStatus() {
                        if (hasUpcoming !== null) {
                            return Promise.resolve(hasUpcoming);
                        }
                        if (fetchPromise) {
                            return fetchPromise;
                        }
                        fetchPromise = fetch('upcoming.md')
                            .then(function (res) {
                                if (!res.ok) {
                                    hasUpcoming = false;
                                    return false;
                                }
                                return res.text();
                            })
                            .then(function (text) {
                                if (typeof text !== 'string') {
                                    return hasUpcoming;
                                }
                                hasUpcoming = RELEASE_HEADER_RE.test(text);
                                return hasUpcoming;
                            })
                            .catch(function () {
                                hasUpcoming = false;
                                return false;
                            });
                        return fetchPromise;
                    }

                    function removeUpcomingButton() {
                        var existing = document.getElementById(BTN_ID);
                        if (existing) {
                            existing.remove();
                        }
                    }

                    function isOnUpcomingPage() {
                        var path = (window.location.hash || '')
                            .replace(/^#/, '')
                            .split('?')[0];
                        return path === '/upcoming' || path === 'upcoming';
                    }

                    function injectUpcomingButton() {
                        if (window.SIMPL_GATE && !window.SIMPL_GATE.isUnlocked()) {
                            removeUpcomingButton();
                            return;
                        }

                        var onUpcoming = isOnUpcomingPage();
                        var link = document.getElementById(BTN_ID);
                        if (!link) {
                            link = document.createElement('a');
                            link.id = BTN_ID;
                            link.className = 'upcoming-release-btn';
                            link.addEventListener('click', requestScrollTop);
                            document.body.appendChild(link);
                        }

                        if (onUpcoming) {
                            link.href = '#/README';
                            link.textContent = '⮢ Back to official releases';
                        } else {
                            link.href = '#/upcoming';
                            link.textContent = '🚀 New release incoming!';
                        }
                    }

                    function bindArchiveButton() {
                        var archiveBtns = document.querySelectorAll('.archive-releases-btn');
                        archiveBtns.forEach(function (archiveBtn) {
                            if (archiveBtn.dataset.scrollBound === '1') {
                                return;
                            }
                            archiveBtn.dataset.scrollBound = '1';
                            archiveBtn.addEventListener('click', requestScrollTop);
                        });
                    }

                    function syncUpcomingButton() {
                        ensureUpcomingStatus().then(function (show) {
                            if (show) {
                                injectUpcomingButton();
                            } else {
                                removeUpcomingButton();
                            }
                        });
                    }

                    hook.doneEach(function () {
                        bindArchiveButton();
                        syncUpcomingButton();
                        if (scrollTopPending) {
                            scrollTopPending = false;
                            // Defer until Docsify finishes layout after route change.
                            setTimeout(scrollToTop, 0);
                        }
                    });
                }
            ]
        };

        window.handleSimplGate = function (event) {
            event.preventDefault();
            var form = event.target;
            var input = form.querySelector('#release-gate-input');
            var error = form.querySelector('#release-gate-error');
            var PASS = 'simplware-release';

            if (!input) {
                return false;
            }

            if (input.value === PASS) {
                window.SIMPL_GATE.setUnlocked();

                if (error) {
                    error.style.display = 'none';
                }

                window.SIMPL_GATE.redirectToTargetIfUnlocked();
            } else if (error) {
                error.style.display = 'block';
            }

            return false;
        };
    </script>

    <!-- docsify -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

    <!-- docsify-themeable -->
    <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>

</html>
